server {
    listen 80;
    server_name crm.hyperisp.com.ar;

    # Redirigir todo HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm.hyperisp.com.ar;

    # Certificados SSL (Let's Encrypt - certbot los genera automáticamente)
    ssl_certificate     /etc/letsencrypt/live/crm.hyperisp.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.hyperisp.com.ar/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logs
    access_log /var/log/nginx/hypercrm.access.log;
    error_log  /var/log/nginx/hypercrm.error.log;

    # Archivos estáticos de Next.js (caché agresivo)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy principal → Next.js en puerto 3001
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout   60s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;

        # Webhooks de Meta/Telegram pueden recibir payloads grandes
        client_max_body_size 10M;
    }
}
