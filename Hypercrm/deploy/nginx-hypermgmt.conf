# =============================================
# BLOQUE 1: www.hypermgmt.com.ar - Landing Page
# Directorio: /opt/hyperisp/hypermgmt
# =============================================

server {
    listen 443 ssl;
    server_name www.hypermgmt.com.ar;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/www.hypermgmt.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.hypermgmt.com.ar/privkey.pem;

    root /opt/hyperisp/hypermgmt;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /admin/ - Java Web Start (JNLP + JAR)
    location /admin/ {
        autoindex on;
        add_header Access-Control-Allow-Origin *;
        try_files $uri $uri/ =404;
    }

    # MIME type para archivos .jnlp
    location ~* \.jnlp$ {
        default_type application/x-java-jnlp-file;
        add_header Access-Control-Allow-Origin *;
    }
}

# HTTP para www.hypermgmt.com.ar
# /admin/ se sirve por HTTP directo (el JNLP usa codebase http://)
# El resto redirige a HTTPS
server {
    listen 80;
    server_name www.hypermgmt.com.ar;

    root /opt/hyperisp/hypermgmt;

    # /admin/ servido por HTTP directo (Java Web Start)
    location /admin/ {
        autoindex on;
        add_header Access-Control-Allow-Origin *;
        try_files $uri $uri/ =404;
    }

    location ~* \.jnlp$ {
        default_type application/x-java-jnlp-file;
        add_header Access-Control-Allow-Origin *;
    }

    # Todo lo demas redirige a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================
# BLOQUE 2: portal.hyperisp.com.ar - Panel Admin
# Proxy a localhost:3000
# =============================================

server {
    if ($host = portal.hyperisp.com.ar) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name portal.hyperisp.com.ar 190.9.0.170 _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name portal.hyperisp.com.ar 190.9.0.170 _;
    client_max_body_size 50M;
    ssl_certificate /etc/letsencrypt/live/portal.hypermgmt.com.ar/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/portal.hypermgmt.com.ar/privkey.pem; # managed by Certbot

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
